[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matplan"
version = "0.1.0"
description = "Måltidsplanerare: mycket protein, låg kcal, stor volym, med aktuella matpriser."
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
matplan = "matplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
